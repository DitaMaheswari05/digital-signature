server {
    listen 443 ssl;
    # Proxy bertindak sebagai TLS server ke client dan menggunakan server certificate
    ssl_certificate     /etc/pki/runtime/server-fullchain.crt;
    ssl_certificate_key /etc/pki/runtime/servercert.key;

    location / {
        proxy_pass https://waf:8443;

        # Proxy bertindak sebagai mTLS client ke WAF dan memanfaatkan client certificate
        proxy_ssl_certificate     /etc/pki/runtime/client-fullchain.crt;
        proxy_ssl_certificate_key /etc/pki/runtime/clientcert.key;

        proxy_ssl_trusted_certificate /etc/pki/runtime/server-ca-bundle.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 2;

        # Teruskan informasi ke backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}