server {
    listen 8443 ssl;
    http2 off;

    # ── Server Certificate (untuk TLS ke proxy) ─────────────────────────────
    ssl_certificate     /etc/pki/runtime/server-fullchain.crt;
    ssl_certificate_key /etc/pki/runtime/servercert.key;

    # ── Client Certificate Verification (mTLS) ──────────────────────────────
    # "optional_no_ca" = client cert opsional di TLS layer; verifikasi manual
    # dilakukan per-location sehingga /healthz bisa bypass tanpa client cert.
    # ssl_verify_client tidak boleh diletakkan di dalam location block.
    ssl_client_certificate /etc/pki/runtime/client-ca-bundle.crt;
    ssl_verify_client      optional_no_ca;
    ssl_verify_depth       3;  # chain: leaf → ClientCA → RootCA

    # ── Buffer settings untuk body terenkripsi + header PEM cert besar ───────
    # X-SSL-Client-Cert berisi full PEM URL-encoded (~2-4 KB)
    proxy_buffer_size          16k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;

    # Header buffer untuk $ssl_client_escaped_cert yang bisa > 4KB
    large_client_header_buffers 4 16k;

    # Izinkan body JSON terenkripsi (encrypted_body + signature + client_cert)
    client_max_body_size 10m;
    client_body_buffer_size 10m;

    # Timeout cukup untuk kriptografi di waf_service
    proxy_read_timeout    60s;
    proxy_connect_timeout 10s;

    # ── Healthcheck endpoint: bypass mTLS & ModSecurity ──────────────────────
    # ssl_verify_client tidak boleh di dalam location; sudah di-handle oleh
    # optional_no_ca di level server — /healthz bisa diakses tanpa client cert.
    location = /healthz {
        access_log off;
        modsecurity off;        # Bypass WAF untuk healthcheck internal
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        # Verifikasi manual: tolak request tanpa client cert yang valid
        if ($ssl_client_verify != SUCCESS) {
            return 403 "mTLS required: client certificate missing or invalid";
        }

        auth_request /_verify_signature;
        auth_request_set $auth_status $upstream_status;
        proxy_pass   http://webapp:8000;

        # Teruskan header host ke webapp
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /_verify_signature {
        internal;
        modsecurity off;
        proxy_pass http://waf_service:9000/verify;

        # Paksa method POST agar waf_service selalu menerima request
        proxy_method POST;

        proxy_pass_request_body off;
        proxy_set_header Content-Length 0;
        proxy_set_header Content-Type "";
        proxy_set_header X-Original-Method $request_method;

        # ── mTLS headers ──────────────────────────────────────────────────
        # Hasil verifikasi TLS dari nginx (SUCCESS | FAILED | NONE)
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        # Subject DN dari client cert (untuk logging / audit)
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
        # PEM cert (URL-encoded) untuk verifikasi kriptografis di waf_service
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;

        # ── RFC 9421: metadata request asli ───────────────────────────────
        # Path dan authority asli dari proxy (sebelum nginx mengubah URL saat
        # meneruskan ke waf_service via auth_request). Digunakan oleh
        # _StarletteRequestAdapter untuk merekonstruksi signature base string
        # yang sama persis dengan yang dibuat proxy saat signing.
        proxy_set_header X-Original-Path      $request_uri;
        proxy_set_header X-Original-Authority $http_host;

        # ── RFC 9421: HTTP Message Signature headers ───────────────────────
        # Ketiga header ini dibuat oleh proxy (http_signer.py) dan harus
        # diteruskan ke waf_service agar Layer 3 bisa melakukan verifikasi.
        proxy_set_header Content-Digest   $http_content_digest;
        proxy_set_header Signature-Input  $http_signature_input;
        proxy_set_header Signature        $http_signature;

        # Buffer lokal untuk respons waf_service
        proxy_buffer_size       16k;
        proxy_buffers           4 16k;
    }
}

