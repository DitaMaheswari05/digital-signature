upstream waf_service_backend {
    server waf_service:9000;
    keepalive 64;          # max idle keepalive connections ke waf_service
    keepalive_requests 500;
    keepalive_time 60s;
}

server {
    listen 8443 ssl;
    http2 off;

    keepalive_requests 1000;
    keepalive_timeout  65s;

    ssl_certificate     /etc/pki/runtime/server-fullchain.crt;
    ssl_certificate_key /etc/pki/runtime/servercert.key;

    ssl_client_certificate /etc/pki/runtime/client-ca-bundle.crt;
    ssl_verify_client      optional_no_ca;
    ssl_verify_depth       3;

    proxy_buffer_size          16k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;

    large_client_header_buffers 4 16k;

    client_max_body_size 10m;
    client_body_buffer_size 10m;

    proxy_read_timeout    60s;
    proxy_connect_timeout 10s;

    location = /healthz {
        access_log off;
        modsecurity off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        if ($ssl_client_verify != SUCCESS) {
            return 403 "mTLS required: client certificate missing or invalid";
        }

        auth_request /_verify_signature;
        auth_request_set $auth_status $upstream_status;
        proxy_pass   http://webapp:8000;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /_verify_signature {
        internal;
        modsecurity off;
        proxy_pass http://waf_service_backend/verify;

        proxy_method POST;

        proxy_pass_request_body off;
        proxy_set_header Content-Length 0;
        proxy_set_header Content-Type "";
        proxy_set_header X-Original-Method $request_method;

        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Cert   $ssl_client_escaped_cert;

        proxy_set_header X-Original-Path      $request_uri;
        proxy_set_header X-Original-Authority $http_host;

        proxy_set_header X-CMS-Payload        $http_x_cms_payload;

        proxy_buffer_size       16k;
        proxy_buffers           4 16k;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

