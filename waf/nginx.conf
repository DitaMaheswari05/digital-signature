server {
    listen 8443 ssl;
    ssl_certificate     /etc/pki/runtime/server-fullchain.crt;
    ssl_certificate_key /etc/pki/runtime/servercert.key;

    ssl_client_certificate /etc/pki/runtime/client-ca-bundle.crt;
    ssl_verify_client on;
    ssl_verify_depth  2;

    location / {
        auth_request /_verify_signature;
        proxy_pass http://webapp:8000;

        # Teruskan header host ke webapp
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /_verify_signature {
        internal;
        proxy_pass http://waf_service:9000/verify;

        # Teruskan body request untuk verifikasi signature
        proxy_pass_request_body on;
        proxy_set_header Content-Type   $content_type;
        proxy_set_header Content-Length $content_length;

        # Kirim cert client (URL-encoded) ke waf_service untuk diverifikasi
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
    }
}