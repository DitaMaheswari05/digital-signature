services:
  proxy:
    build: ./proxy
    ports: ["8080:8080"]
    volumes:
      - ./key_cert:/key_cert:ro
    networks:
      - mtls-net
    depends_on:
      - waf

  waf:
    build: ./waf
    volumes:
      - ./key_cert:/etc/pki/key_cert:ro
      - ./scripts/entrypoint.sh:/docker-entrypoint.d/99-prepare-certs.sh:ro
    tmpfs:
      - /etc/pki/runtime:mode=01777
    networks:
      - mtls-net
    depends_on:
      - waf_service
      - webapp

  waf_service:
    build: ./waf/waf_service
    volumes:
      - ./key_cert:/key_cert:ro   # CA bundle untuk trust anchor verification (Layer 2)
    networks:
      - mtls-net

  webapp:
    build: ./webapp
    volumes:
      - ./key_cert:/etc/pki/key_cert:ro
    networks:
      - mtls-net

  client:
    build: ./client
    networks:
      - mtls-net
    depends_on:
      - proxy
    stdin_open: true
    tty: true

networks:
  mtls-net:
    driver: bridge