services:
  proxy:
    build: ./proxy
    ports: ["443:443"]
    volumes:
      - ./key_cert:/etc/pki/key_cert:ro
      - ./scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    tmpfs:
      - /etc/pki/runtime
    networks:
      - mtls-net
    depends_on:
      - waf

  waf:
    build: ./waf
    volumes:
      - ./key_cert:/etc/pki/key_cert:ro
      - ./scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    tmpfs:
      - /etc/pki/runtime
    networks:
      - mtls-net
    depends_on:
      - waf_service
      - webapp

  waf_service:
    build: ./waf/waf_service
    networks:
      - mtls-net

  webapp:
    build: ./webapp
    volumes:
      - ./key_cert:/etc/pki/key_cert:ro
    networks:
      - mtls-net

  client:
    build: ./client
    volumes:
      - ./key_cert:/etc/pki/key_cert:ro
    networks:
      - mtls-net
    depends_on:
      - proxy

networks:
  mtls-net:
    driver: bridge